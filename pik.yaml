schema: 1
requires:
  - name: docker
  - name: node
    version: 26.0.0
  - name: pnpm
    version: 12.0.0
prompts:
  - name: name
    message: Project name, in kebab-case
    pattern: ^[a-z][a-z0-9-]{0,49}$
    default: "{{dir}}"
  - name: owner
    message: GitHub owner, for README links and code owners
    pattern: ^[A-Za-z0-9-]{1,39}$
    optional: true
replace:
  - from: "opikdev/api-hono-starter\ncd api-hono-starter\n"
    to: "{{owner}}/{{name}}\ncd {{name}}\n"
    files: [README.md]
  - from: opikdev/api-hono-starter
    to: "{{owner}}/{{name}}"
    files: [README.md]
  - from: "@opikdev"
    to: "@{{owner}}"
    files: [.github/CODEOWNERS]
  - from: api-hono-starter
    to: "{{name}}"
    files:
      - package.json
      - compose.yaml
      - .devcontainer/devcontainer.json
      - src/instrumentation.ts
      - docs/client.md
      - test/e2e/stack.test.ts
exclude:
  - .baseline.sha256
  - .github/workflows/baseline-check.yml
setup:
  - pnpm install
  - pnpm exec biome format --write .
next:
  - docker compose up --build --wait api
check:
  - pnpm verify
  - pnpm test:e2e
