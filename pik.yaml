schema: 1
requires:
  - name: docker
  - name: node
    version: 26.0.0
  - name: pnpm
    version: 12.0.0
prompts:
  - name: name
    message: Project name, in kebab-case
    pattern: ^[a-z][a-z0-9-]{0,49}$
    default: "{{dir}}"
  - name: owner
    message: GitHub owner, for README links and code owners
    pattern: ^[A-Za-z0-9-]{1,39}$
    optional: true
replace:
  - from: '"extends": ["config:recommended", "github>opikdev/starters//renovate/baseline"]'
    to: '"extends": ["config:recommended"]'
    files: [renovate.json]
  - from: "## Start your own project\n\nCreate a renamed copy with [pik](https://github.com/opikdev/pik). It downloads this starter's latest release, then sets your project name and GitHub owner:\n\n```sh\npik new api-hono-starter my-api\n```\n\nOr select **Use this template** on GitHub. That copy keeps the name `api-hono-starter` and the owner `opikdev`, so follow `pik.yaml` by hand: swap the `replace` text, delete the `exclude` paths, and run the `setup` commands.\n\n## Usage\n"
    to: "## Usage\n"
    files: [README.md]
  - from: "opikdev/api-hono-starter\ncd api-hono-starter\n"
    to: "{{owner}}/{{name}}\ncd {{name}}\n"
    files: [README.md]
  - from: opikdev/api-hono-starter
    to: "{{owner}}/{{name}}"
    files: [README.md]
  - from: "@opikdev"
    to: "@{{owner}}"
    files: [.github/CODEOWNERS]
  - from: "# API Hono starter\n"
    to: "# {{name}}\n"
    files: [README.md]
  - from: api-hono-starter
    to: "{{name}}"
    files:
      - package.json
      - compose.yaml
      - .devcontainer/devcontainer.json
      - src/instrumentation.ts
      - docs/client.md
      - test/e2e/stack.test.ts
      - test/integration/http.test.ts
exclude:
  - .baseline.sha256
  - .github/workflows/baseline-check.yml
setup:
  - pnpm install
  - pnpm pkg set version=0.1.0
  - printf '# Changelog\n\nAll notable changes to this project are recorded here. The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).\n\n## [Unreleased]\n' > CHANGELOG.md
  - pnpm openapi:generate
  - pnpm exec biome format --write .
next:
  - docker compose up --build --wait api
check:
  - pnpm verify
  - pnpm test:e2e
