services:
  dev:
    image: node:26
    command: sleep infinity
    working_dir: /workspace
    volumes:
      # Relative to the repo root, because compose.yaml is the first file loaded.
      - .:/workspace
      - dev-node-modules:/workspace/node_modules
    environment:
      DATABASE_URL: postgres://api_app:api_app_dev_password@db:5432/api
      MIGRATION_DATABASE_URL: postgres://api_owner:api_owner_dev_password@db:5432/api
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dev-node-modules:
